name: Publish demo to gh-pages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate tag matches package version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json version ($PACKAGE_VERSION)."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build demo
        run: npm --prefix demo-app run build

      - name: Deploy to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          BRANCH="gh-pages"
          TARGET="/tmp/gh-pages"
          rm -rf "$TARGET" || true
          mkdir -p "$TARGET"
          if git ls-remote --exit-code --heads "$REPO_URL" "$BRANCH"; then
            git clone --branch "$BRANCH" --depth 1 "$REPO_URL" "$TARGET"
          else
            git clone "$REPO_URL" "$TARGET"
            cd "$TARGET"
            git checkout --orphan "$BRANCH"
            git rm -rf .
          fi
          cd "$TARGET"
          rm -rf demo || true
          mkdir -p demo
          cp -r "$GITHUB_WORKSPACE/demo-app/dist/." demo/
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy"
          else
            git commit -m "chore(demo): deploy demo for ${GITHUB_REF_NAME}"
            git push --force "$REPO_URL" "$BRANCH"
          fi
